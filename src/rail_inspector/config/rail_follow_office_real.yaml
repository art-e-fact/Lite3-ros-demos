# Office real-robot defaults for rail_target_follow_real.launch.py

/**:
  ros__parameters:
    use_sim_time: false

local_heightmap_node:
  ros__parameters:
    cloud_topic: /livox/lidar
    odom_topic: /leg_odom2
    heightmap_topic: /local_heightmap
    map_frame: odom
    robot_frame: base_link
    resolution: 0.025
    length_x: 8.0
    length_y: 8.0
    min_z: -1.0
    max_z: 2.0
    min_range: 0.2
    max_range: 12.0  # 35.0
    stale_time_sec: 100.0
    front_clear_enabled: false # enable if target is moving 
    front_clear_length: 2.5
    front_clear_width: 1.0
    front_clear_offset_x: 0.25
    front_stale_time_sec: 0.75
    max_pose_variance: 0.0

rail_detector_node:
  ros__parameters:
    heightmap_topic: /local_heightmap
    odom_topic: /leg_odom2
    marker_topic: /rail_detector/markers
    center_offset_topic: /rail_detector/center_offset
    tangent_yaw_topic: /rail_detector/tangent_yaw
    target_distance_topic: /rail_detector/target_distance
    track_gauge: 0.9  # 0.75, 0.87, 0.54
    rail_width: 0.03  # 0.014, 0.028
    gauge_tolerance: 0.40  # 0.01
    angle_sweep_deg: 0.0
    angle_step_deg: 5.0
    min_rail_height: 0.05
    max_rail_height: 0.3
    max_rail_height_difference: 0.08  # 0.02, 0.12
    forward_span: 2.6  # 5.0
    backward_span: 0.0
    num_slices: 30
    lateral_search_width: 0.7  # 1.0, 0.6
    follow_target_lookahead: 2.0
    follow_target_kernel_size: 0.35
    follow_target_sample_step: 0.10  # 0.05
    follow_target_min_height: 0.22
    follow_target_max_height: 0.8

rail_target_follower_node:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    odom_topic: /leg_odom2
    center_offset_topic: /rail_detector/center_offset
    tangent_yaw_topic: /rail_detector/tangent_yaw
    target_distance_topic: /rail_detector/target_distance
    follow_mode: teleop  # auto
    follow_rail_speed_topic: /follow_rail_speed
    control_rate_hz: 15.0
    stale_timeout_sec: 0.5
    follow_distance: 1.5  # 0.4
    target_distance_deadband: 0.1
    min_linear_x: 0.35
    max_linear_x: 0.45
    distance_error_for_max_speed: 1.5
    max_linear_y: 0.4
    max_angular_z: 0.5
    k_center: 1.0
    k_heading: 1.2
