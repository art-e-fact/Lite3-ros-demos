# Office real-robot defaults for rail_target_follow_real.launch.py

/**:
  ros__parameters:
    use_sim_time: false

local_heightmap_node:
  ros__parameters:
    cloud_topic: /livox/lidar
    odom_topic: /leg_odom2
    heightmap_topic: /local_heightmap
    map_frame: odom
    robot_frame: base_link
    resolution: 0.025
    length_x: 8.0
    length_y: 8.0
    min_z: -1.0
    max_z: 0.4 # [!] for indoor env, surrounding obstacles, low ceiling
    min_range: 0.2
    max_range: 2.5 # [?] should be same as forward_span?
    stale_time_sec: 100.0
    front_clear_enabled: true # enable if target is moving 
    front_clear_length: 2.5
    front_clear_width: 1.0
    front_clear_offset_x: 0.0 # clear from robot body
    front_stale_time_sec: 0.1 # [!] reduce this to actively reflect dynamic moving target
    max_pose_variance: 0.0

rail_detector_node:
  ros__parameters:
    heightmap_topic: /local_heightmap
    odom_topic: /leg_odom2
    marker_topic: /rail_detector/markers
    center_offset_topic: /rail_detector/center_offset
    tangent_yaw_topic: /rail_detector/tangent_yaw
    target_distance_topic: /rail_detector/target_distance
    track_gauge: 0.9  # distance between inner sides of 2 rails
    rail_width: 0.06 # [!] should be at least 0.06 (even for smaller ones) for more consistent rails detection 
    gauge_tolerance: 0.40
    angle_sweep_deg: 0.0
    angle_step_deg: 5.0
    min_rail_height: 0.07 # [!!] important param, seems to influence behavior of follower/push-to-go modes a lot, consider lower values to be more active (more detected rail points), higher values to be more careful (fewer detected rail points)
    max_rail_height: 0.3
    max_rail_height_difference: 0.1 # [!] maybe not too high to exclude outliers
    baseline_auto: false
    baseline_z: 0.0
    forward_span: 2.5 # [!] 
    backward_span: 2.0 # [!] for moving backward
    num_slices: 60 # [!] change based on forward_span, backward_span
    lateral_search_width: 1.2 # [!] seems enough to cover rails even when robot is not parallel to rails
    follow_target_lookahead: 2.0
    follow_target_kernel_size: 0.35
    follow_target_sample_step: 0.10 
    follow_target_min_height: 0.22
    follow_target_max_height: 0.8 # [!] depending on target / outliers (indoor)

rail_target_follower_node:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    odom_topic: /leg_odom2
    center_offset_topic: /rail_detector/center_offset
    tangent_yaw_topic: /rail_detector/tangent_yaw
    target_distance_topic: /rail_detector/target_distance
    follow_mode: auto #teleop #auto #teleop  # auto
    follow_rail_speed_topic: /follow_rail_speed
    control_rate_hz: 15.0
    stale_timeout_sec: 1.0 # [!!] important param, seems to influence behavior of follower/push-to-go modes a lot, consider lower values to be more careful, higher values to be more active
    follow_distance: 0.5 # [!] how close robot should maintain to target
    target_distance_deadband: 0.1
    min_linear_x: 0.35
    max_linear_x: 0.45
    distance_error_for_max_speed: 1.5
    max_linear_y: 0.4
    max_angular_z: 0.5
    k_center: 1.0
    k_heading: 1.2

