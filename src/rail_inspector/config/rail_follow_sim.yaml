/**:
  ros__parameters:
    use_sim_time: true

local_heightmap_node:
  ros__parameters:
    cloud_topic: /mid360/points
    odom_topic: /odom
    heightmap_topic: /local_heightmap
    map_frame: odom
    robot_frame: base_link
    resolution: 0.025
    length_x: 4.0
    length_y: 4.0
    min_z: -1.0
    max_z: 2.0
    min_range: 0.2
    max_range: 12.0  # 35.0
    stale_time_sec: 100.0
    front_clear_enabled: true
    front_clear_length: 2.5
    front_clear_width: 1.0
    front_clear_offset_x: 0.25
    front_stale_time_sec: 0.75
    max_pose_variance: 0.0

elevation_mapping_node:
  ros__parameters:
    # From elevation_mapping_cupy/config/setups/lite3/mid360.yaml, tuned for rail follow.
    map_frame: odom
    base_frame: base_link
    corrected_map_frame: odom
    resolution: 0.025
    map_length: 10.0
    min_valid_distance: 0.1
    max_ray_length: 12.0
    max_height_range: 2.0
    update_pose_fps: 20.0
    map_acquire_fps: 10.0
    enable_visibility_cleanup: true
    enable_drift_compensation: false
    subscribers:
      mid360:
        topic_name: /mid360/points
        data_type: pointcloud
    publishers:
      local_heightmap:
        layers: ["elevation", "variance", "traversability"]
        basic_layers: ["elevation"]
        fps: 10.0

rail_detector_node:
  ros__parameters:
    heightmap_topic: /local_heightmap
    odom_topic: /odom
    marker_topic: /rail_detector/markers
    center_offset_topic: /rail_detector/center_offset
    tangent_yaw_topic: /rail_detector/tangent_yaw
    target_distance_topic: /rail_detector/target_distance
    track_gauge: 1.067
    rail_width: 0.15
    gauge_tolerance: 0.40  # 0.01
    angle_sweep_deg: 0.0
    angle_step_deg: 5.0
    min_rail_height: 0.05
    max_rail_height: 0.2
    max_rail_height_difference: 0.08  # 0.02, 0.12
    baseline_auto: true
    baseline_z: 0.08
    forward_span: 2.6
    backward_span: 0.0
    num_slices: 15
    lateral_search_width: 1.8
    follow_target_lookahead: 2.0
    follow_target_kernel_size: 0.35
    follow_target_sample_step: 0.10  # 0.05
    follow_target_min_height: 0.22
    follow_target_max_height: 0.8

rail_target_follower_node:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    odom_topic: /odom
    center_offset_topic: /rail_detector/center_offset
    tangent_yaw_topic: /rail_detector/tangent_yaw
    target_distance_topic: /rail_detector/target_distance
    follow_mode: auto
    follow_rail_speed_topic: /follow_rail_speed
    control_rate_hz: 15.0
    stale_timeout_sec: 0.75
    follow_distance: 1.5
    target_distance_deadband: 0.1
    min_linear_x: 0.35
    max_linear_x: 0.45
    distance_error_for_max_speed: 1.5
    max_linear_y: 0.4
    max_angular_z: 0.5
    k_center: 1.0
    k_heading: 1.2
