lego_loam_ip:
  ros__parameters:
    use_sim_time: false
    # leishen16
    laser:
        odom_type: "wheel_odometry" #"laser_odometry" #"wheel_odometry" #"laser_odometry"         #wheel_odometry/laser_odometry 
        baselink_frame: "base_link" #"base_footprint"
        num_vertical_scans: 32
        num_horizontal_scans: 1000
        vertical_angle_bottom: -10.0 #-7.0          # degrees
        vertical_angle_top: 52.0            # degrees
        scan_period: 0.1                   # seconds

    imageProjection:
        segment_valid_point_num: 5
        segment_valid_line_num: 2
        segment_theta: 60.0 #30.0 #60.0                      # decrese this value may improve accuracy
        minimum_detection_range: 0.0 #0.0 #0.0 #0.05 #1.0 #0.5
        maximum_detection_range: 100.0            # point cloud within this range will be used to project image
        distance_for_patch_between_rings: 1.0    # patch ground between rings within this range, i.e. ring0 and ring1 is smaller than 1 meter, patch them
        stitcher_num: 3 #6 #3                          # for non-repetitive scan lidar use 2~4 (i.e. mid360)
        trt_model_path: ""                       # provide trt engine for yolo
        projected_image_stack_size: 1            # Stack this number of image for yolo11n to inference as time elapsed yolo (only work when TRT is loaded)
        patch_first_ring_to_baselink: false
        ground_slope_tolerance: 0.7 #0.3

        ground_fov_bottom: 0. #-1.2 #0.12217 #0.0 #-0.2617994 # -15deg
        ground_fov_top: 0.2967 #0.6 #0.2967 #0.2094 #0.2967 #0.34906 #0.47  #-0.087266 # -5deg
        ground_positive_start: 0.0
        ground_positive_stop: 0.785 #0.3925 #0.785 #1.5707 #0.785 #1.5707 #3.1415926 #1.5707 #3.1415926
        ground_negative_start: 0.0
        ground_negative_stop: -0.785 #-0.3925 #-0.785 #-1.5707 #-0.785 #-1.5707 #-3.1415926 #-1.5707 #-3.1415926

lego_loam_fa:
  ros__parameters:
    use_sim_time: false
    featureAssociation:                              
        edge_threshold: 0.1
        surf_threshold: 0.1
        nearest_feature_search_distance: 3.0

    mapping:
        to_map_optimization: true

lego_loam_mo:
  ros__parameters:
    use_sim_time: false
    mapping:

        distance_between_key_frame: 1.0 #0.1 #1.0
        angle_between_key_frame: 1.0 #0.4 #1.0

        enable_loop_closure: true

        surrounding_keyframe_search_num: 20
        history_keyframe_search_radius: 12.0
        history_keyframe_search_num: 5
        history_keyframe_fitness_score: 0.5
        
        ground_voxel_size: 1.5 #1.0 #0.6 #0.4 #0.3
        ground_edge_threshold_num: 50