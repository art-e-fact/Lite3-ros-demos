# Reference only. This file is not loaded by the simulator.
# Runtime defaults live in interface/robot/simulation/simulation_config.py.

simulator: newton

# Scene XML/MJCF for the environment, or a MuJoCo procedural scene URI
# such as procedural://blocks or procedural://railroad.
scene: package://lite3_sdk_deploy/Lite3_description/lite3_mjcf/mjcf/stairs_floors.xml

# Robot description. Newton also supports the USD path below.
robot_description: package://lite3_sdk_deploy/Lite3_description/lite3_mjcf/mjcf/Lite3.xml
# robot_description: package://lite3_sdk_deploy/Lite3_description/Lite3_usd/Lite3.usd

# Run without a viewer by default.
headless: true

procedural_env_seed: -1

sensors:
  realsense:
    enable_depth: false
    enable_color: false
    enable_pointcloud: false
    width: 640
    height: 480
    frequency_hz: 15.0
    depth_range_min: 0.105
    depth_range_max: 10.0
    depth_fx: 382.68
    depth_fy: 382.68
    depth_cx: 320.0
    depth_cy: 240.0
    color_fx: 615.69
    color_fy: 615.69
    color_cx: 320.0
    color_cy: 240.0
    depth_image_topic: /camera/depth/image_rect_raw
    depth_info_topic: /camera/depth/camera_info
    color_image_topic: /camera/color/image_raw
    color_info_topic: /camera/color/camera_info
    pointcloud_topic: /camera/depth/color/points
    depth_optical_frame: camera_depth_optical_frame
    color_optical_frame: camera_color_optical_frame
    camera_link_frame: camera_link
    depth_frame: camera_depth_frame
    color_frame: camera_color_frame
    mount_site_name: d435i_mount
    depth_camera_name: d435i-depth
    color_camera_name: d435i-color
    forward_offset: [0.01, 0.0, 0.0]

  lidar_2d:
    enabled: false
    site_name: lidar_site
    frame_id: lidar
    topic: /scan
    frequency_hz: 10.0
    num_rays: 360
    range_min: 0.15
    range_max: 8.0
    visualize_rays: false

  mid360:
    enabled: false
    mount_site_name: mid360_mount
    attachment_prefix: mid360-
    sensor_site_name: lidar_frame
    frame_id: mid360
    topic: /mid360/points
    frequency_hz: 10.0
    pattern_file: mid360.npy
    samples_per_scan: 24000
    range_min: 0.1
    range_max: 200.0
    downsample: 1

  robosense:
    enabled: false
    frequency_hz: 10.0
    channels: 96
    columns: 448
    column_downsample: 8
    v_fov_deg: [-45.0, 45.0]
    range_min: 0.1
    range_max: 30.0
    enable_rear: true
    front:
      site_name: lidar_front_site
      frame_id: lidar_front
      topic: /lidar_front/points
    rear:
      site_name: lidar_back_site
      frame_id: lidar_back
      topic: /lidar_back/points

  follow_camera:
    enabled: false
    video_path: ''
    fps: 20.0
    width: 640
    height: 480
    distance_m: 4.0
    elevation_deg: -18.0
    azimuth_offset_deg: 60.0
    target_height_m: 0.55
    smoothing: 0.08
    quality: 8

rerun:
  enabled: false
  spawn: true
  save_path: ''