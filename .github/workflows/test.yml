name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test-task: [test-sim-sensors] # ,test-rerun-recording] # TODO: setup headless running for the rest of the tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.2
          cache: true
          environments: artefacts sim-test sim nav nav-test

      - name: Install EGL Software Drivers (for MuJoCo RGB Rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri

      - name: Pre-build project 
        run: |
          pixi run build

      - name: Run ${{ matrix.test-task }}
        env:
          MUJOCO_GL: egl
          ARTEFACTS_KEY: ${{ secrets.ARTEFACTS_KEY }}
        run: |
          pixi run -e artefacts artefacts run ${{ matrix.test-task }}