[feature.test.dependencies]
pytest = ">=9.0.3,<10"
pyyaml = ">=6.0.3,<7"

[feature.test.activation]
scripts = ["scripts/tests_activation.sh"]

[feature.artefacts.pypi-dependencies]
artefacts-cli = "*"

[feature.artefacts.dependencies]
python = ">=3.14.5,<3.15"


[environments]
test = ["test"]
sim = ["sim"]
sim-test = ["sim", "test"]
nav = ["nav"]
nav-test = ["nav", "test"]
artefacts = ["artefacts"]
