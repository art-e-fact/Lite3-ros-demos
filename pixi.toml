[workspace]
authors = [
    "Tomo Norman <tomo@artefacts.com>",
    "Andras Polgar <andras@artefacts.com>",
    "Bach Nguyen <bach@artefacts.com>",
]
channels = ["https://prefix.dev/conda-forge"]
name = "lite3-workspace"
platforms = ["linux-64", "osx-arm64", "linux-aarch64"]
version = "0.1.0"

[tasks]
build = [
    { task = "build-nav", environment = "nav" },
    { task = "build-sim", environment = "sim" },
]

[tasks.setup]
cmd = "git submodule update --init --recursive"

[tasks.build-nav]
cmd = [
    "colcon",
    "build",
    "--symlink-install",
    "--build-base", "rosbuild/nav/build",
    "--install-base", "rosbuild/nav/install",
    "--test-result-base", "rosbuild/nav/test_results",
    # simulation_package is built in the sim environment; livox_ros_driver2 on real hardware only.
    "--packages-skip", "simulation_package", "livox_ros_driver2",
    "--cmake-args",
    "-DROS_EDITION=ROS2",
    "-DDISTRO_ROS=jazzy",
    "-DBUILD_TESTING=OFF",
]
inputs = ["src"]
outputs = ["rosbuild/nav/install"]
default-environment = "nav"
depends-on = ["setup", "build-livox-ros-driver2"]

# No-op on platforms without real Livox hardware; linux-aarch64 overrides below.
[tasks.build-livox-ros-driver2]
cmd = "true"

# Real Lite3 hardware (linux-aarch64): build the Livox lidar driver separately.
[target.linux-aarch64.tasks.build-livox-ros-driver2]
cmd = [
    "colcon",
    "build",
    "--symlink-install",
    "--build-base", "rosbuild/nav/build",
    "--install-base", "rosbuild/nav/install",
    "--test-result-base", "rosbuild/nav/test_results",
    "--packages-select", "livox_ros_driver2",
    "--cmake-args",
    "-DROS_EDITION=ROS2",
    "-DDISTRO_ROS=jazzy",
    "-DBUILD_TESTING=OFF",
]
inputs = ["src/livox_ros_driver2"]
outputs = ["rosbuild/nav/install"]
default-environment = "nav"
depends-on = ["setup"]

[tasks.build-sim]
cmd = [
    "colcon",
    "build",
    "--build-base", "rosbuild/sim/build",
    "--install-base", "rosbuild/sim/install",
    "--test-result-base", "rosbuild/sim/test_results",
    "--packages-select", "simulation_package", "drdds",
]
inputs = ["src/simulation_package", "src/drdds"]
outputs = ["rosbuild/sim/install"]
default-environment = "sim"
depends-on = ["setup"]


[tasks.test-sim-sensors]
cmd = "pytest src/simulation_package/test/test_simulation_sensors.py -vv -s"
default-environment = "sim-test"
depends-on = ["build"]

[tasks.test-rail-follow]
cmd = "pytest src/rail_inspector/test/test_sim_rail_target_follow_distance.py -vv -s"
default-environment = "nav-test"
depends-on = ["build"]

[tasks.test-rail-follow-mujoco]
cmd = "pytest src/rail_inspector/test/test_sim_rail_target_follow_distance.py --simulator mujoco -vv -s"
default-environment = "nav-test"
depends-on = ["build"]

# GPU (CUDA warp) variant: launches the simulator in the sim-gpu environment.
[tasks.test-rail-follow-gpu]
cmd = "pytest src/rail_inspector/test/test_sim_rail_target_follow_distance.py -vv -s"
default-environment = "nav-test"
depends-on = ["build"]
env = { SIM_PIXI_ENV = "sim-gpu" }

[tasks.test-rerun-recording]
cmd = "pytest src/rail_inspector/test/test_rerun_recording.py -vv -s"
default-environment = "nav-test"
depends-on = ["build"]

[tasks.test-rerun-recording-mujoco]
cmd = "pytest src/rail_inspector/test/test_rerun_recording.py --simulator mujoco -vv -s"
default-environment = "nav-test"
depends-on = ["build"]

[tasks.test-rerun-recording-gpu]
cmd = "pytest src/rail_inspector/test/test_rerun_recording.py -vv -s"
default-environment = "nav-test"
depends-on = ["build"]
env = { SIM_PIXI_ENV = "sim-gpu" }

[tasks.test-rerun-recording-m20]
cmd = "pytest src/rail_inspector/test/test_rerun_recording.py --robot m20 -vv -s"
default-environment = "nav-test"
depends-on = ["build"]

[tasks.test-rerun-recording-m20-mujoco]
cmd = "pytest src/rail_inspector/test/test_rerun_recording.py --robot m20 --simulator mujoco -vv -s"
default-environment = "nav-test"
depends-on = ["build"]

[tasks.test-rerun-recording-m20-gpu]
cmd = "pytest src/rail_inspector/test/test_rerun_recording.py --robot m20 -vv -s"
default-environment = "nav-test"
depends-on = ["build"]
env = { SIM_PIXI_ENV = "sim-gpu" }

[tasks.sim-rail-follow]
cmd = "python -m simulation_package.start_simulation --config src/simulation_package/config/newton_procedural_railroad.yaml"
default-environment = "sim"
depends-on = ["build"]

[tasks.sim-rail-follow-m20]
cmd = "python -m simulation_package.start_simulation --config src/simulation_package/config/newton_procedural_railroad_m20.yaml"
default-environment = "sim"
depends-on = ["build"]

# GPU (CUDA warp) variants of the Newton rail-follow tasks.
[tasks.sim-rail-follow-gpu]
depends-on = [{ task = "sim-rail-follow", environment = "sim-gpu" }]

[tasks.sim-rail-follow-m20-gpu]
depends-on = [{ task = "sim-rail-follow-m20", environment = "sim-gpu" }]

[tasks.sim-rail-follow-mujoco]
cmd = "python -m simulation_package.start_simulation --config src/simulation_package/config/mujoco_procedural_railroad.yaml"
default-environment = "sim"
depends-on = ["build"]

# macOS requires mjpython
[target.osx-arm64.tasks.sim-rail-follow-mujoco]
cmd = "mjpython -m simulation_package.start_simulation --config src/simulation_package/config/mujoco_procedural_railroad.yaml"
default-environment = "sim"
depends-on = ["build"]

[tasks.sim-rail-follow-m20-mujoco]
cmd = "python -m simulation_package.start_simulation --config src/simulation_package/config/mujoco_procedural_railroad_m20.yaml"
default-environment = "sim"
depends-on = ["build"]

[target.osx-arm64.tasks.sim-rail-follow-m20-mujoco]
cmd = "mjpython -m simulation_package.start_simulation --config src/simulation_package/config/mujoco_procedural_railroad_m20.yaml"
default-environment = "sim"
depends-on = ["build"]

[tasks.sim-newton]
cmd = "python -m simulation_package.start_simulation --config src/simulation_package/config/newton_empty.yaml"
default-environment = "sim"
depends-on = ["build"]

[tasks.sim-newton-m20]
cmd = "python -m simulation_package.start_simulation --config src/simulation_package/config/newton_empty_m20.yaml"
default-environment = "sim"
depends-on = ["build"]

[tasks.sim-newton-m20-karuizawa]
cmd = "python -m simulation_package.start_simulation --config src/simulation_package/config/newton_karuizawa_m20.yaml"
default-environment = "sim"
depends-on = ["build"]

[tasks.sim-newton-m20-karuizawa-gpu]
args = [
  { "arg" = "part", "default" = "part1", "choices" = ["part1", "part2", "part3"] },
]
cmd = [
    "python", "-m", "simulation_package.start_simulation", 
    "--config", "src/simulation_package/config/newton_karuizawa_m20.yaml",
    "--set", "scene=hf://datasets/Artefacts/quadruped-environments@72049b46346cf9d14dc81bc5739de61c1af62b9a/mjcf/karuizawa/{{ part }}/karuizawa_{{ part }}.xml"
]

default-environment = "sim-gpu"
depends-on = ["build"]

# GPU (CUDA warp) variants of the Newton tasks.
[tasks.sim-newton-gpu]
depends-on = [{ task = "sim-newton", environment = "sim-gpu" }]

[tasks.sim-newton-m20-gpu]
depends-on = [{ task = "sim-newton-m20", environment = "sim-gpu" }]

[tasks.nav-rail-follow]
cmd = "ros2 launch rail_inspector rail_target_follow.launch.py"
default-environment = "nav"
depends-on = ["build-nav"]

[tasks.nav-rail-follow-m20]
cmd = "ros2 launch rail_inspector rail_target_follow.launch.py params_file:=$(ros2 pkg prefix rail_inspector)/share/rail_inspector/config/rail_follow_sim_m20.yaml deploy_package:=m20_sdk_deploy deploy_args:=--twist"
default-environment = "nav"
depends-on = ["build-nav"]

[tasks.nav-rail-follow-real]
cmd = "ros2 launch rail_inspector rail_target_follow_real.launch.py"
default-environment = "nav"
depends-on = ["build-nav"]

[tasks.nav-rail-follow-real-auto]
cmd = "ros2 launch rail_inspector rail_target_follow_real.launch.py follow_mode:=auto"
default-environment = "nav"
depends-on = ["build-nav"]

[tasks.nav-rail-follow-real-auto-rerun]
cmd = "ros2 launch rail_inspector rail_target_follow_real.launch.py params_file:=$(ros2 pkg prefix rail_inspector)/share/rail_inspector/config/rail_follow_office_real_auto.yaml & ros2 run rerun_logger rerun_logger --headless --onboard-fix"
default-environment = "nav"
depends-on = ["build-nav"]

[tasks.nav-rail-follow-real-push-rerun]
cmd = "ros2 launch rail_inspector rail_target_follow_real.launch.py params_file:=$(ros2 pkg prefix rail_inspector)/share/rail_inspector/config/rail_follow_office_real_push.yaml & ros2 run rerun_logger rerun_logger --headless --onboard-fix"
default-environment = "nav"
depends-on = ["build-nav"]

[tasks.rail-follow-teleop]
cmd = "pixi run -e nav ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r cmd_vel:=/follow_rail_speed"
default-environment = "nav"
depends-on = ["build-nav"]

[tasks.rail-follow-tui]
cmd = "ros2 run rail_inspector rail_follow_tui"
default-environment = "nav"
depends-on = ["build-nav"]

[tasks.rerun-logger]
cmd = "ros2 run rerun_logger rerun_logger"
default-environment = "nav"
depends-on = ["build-nav"]

[feature.sim]
channels = [
    "https://prefix.dev/robostack-kilted",
    "https://prefix.dev/conda-forge",
]

[feature.sim.activation]
scripts = ["rosbuild/sim/install/setup.sh"]

# macOS only: 
# LDFLAGS isn't auto-set in kilted.
[feature.sim.target.osx-arm64.activation.env]
LDFLAGS = "-L$CONDA_PREFIX/lib"

[feature.sim.dependencies]
newton-examples = ">=1.5.1,<2"
mujoco = ">=3.8.1,<4"
trimesh = ">=4.12.2,<5"
imageio = ">=2.37.0,<3"
imageio-ffmpeg = ">=0.6.0,<0.7"
scipy = ">=1.17.1,<2"
pyglm = ">=2.8.3,<3"
ros-kilted-ros2run = ">=0.38.3,<0.39"
ros-kilted-ros2launch = ">=0.28.5,<0.29"
ros-kilted-ros2topic = ">=0.38.3,<0.39"
colcon-common-extensions = ">=0.3.0,<0.4"
ros-kilted-rclcpp = ">=29.5.7,<30"
ros-kilted-geometry-msgs = ">=5.5.2,<6"
ros-kilted-visualization-msgs = ">=5.5.2,<6"
ros-kilted-sensor-msgs-py = ">=5.5.2,<6"
ros-kilted-rosidl-default-generators = ">=1.7.2,<2"
ros-kilted-nav-msgs = ">=5.5.2,<6"
ros-kilted-sensor-msgs = ">=5.5.2,<6"
ros-kilted-tf2-ros = ">=0.41.6,<0.42"
ros-kilted-tf2-ros-py = ">=0.41.6,<0.42"
huggingface_hub = ">=1.29.0,<2"

[feature.sim.pypi-dependencies]
perlin-noise = ">=1.14, <2"

# Opt-in GPU feature: requires an NVIDIA driver, so keep it out of the base sim
# env (CI runners have no GPU). Declares __cuda so the cuda warp-lang build solves.
[feature.sim-cuda.system-requirements]
cuda = "12"

[feature.sim-cuda.target.linux-64.dependencies]
warp-lang = { version = ">=1.17.0,<2", build = "cuda*" }

[feature.rerun.pypi-dependencies]
rerun-loader-mjcf = ">=1.0.1, <2"
rerun-sdk = { version = ">=0.33.0, <0.34", extras = ["catalog"] }

[feature.nav]
channels = [
    "https://prefix.dev/robostack-jazzy",
    "https://prefix.dev/conda-forge",
]

[feature.nav.activation]
scripts = ["rosbuild/nav/install/setup.sh"]

[feature.nav.dependencies]
ros-jazzy-ros2run = ">=0.32.8,<0.33"
ros-jazzy-ros2launch = ">=0.26.11,<0.27"
ros-jazzy-ros2topic = ">=0.32.8,<0.33"
ros-jazzy-rclcpp = ">=28.1.16,<29"
ros-jazzy-ament-cmake-auto = ">=2.5.5,<3"
ros-jazzy-ament-cmake = ">=2.5.5,<3"
ros-jazzy-rosidl-default-generators = ">=1.6.0,<2"
ros-jazzy-rosidl-default-runtime = ">=1.6.0,<2"
ros-jazzy-geometry-msgs = ">=5.3.6,<6"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=1.11.0,<2"
pkg-config = ">=0.29.2,<0.30"
cmake = ">=4.3.3,<5"
ninja = ">=1.13.2,<2"
sysroot_linux-64 = ">=2.17,<3"
pytest = ">=9.0.3,<10"
ros-jazzy-nav-msgs = ">=5.3.6,<6"
ros-jazzy-sensor-msgs = ">=5.3.6,<6"
ros-jazzy-tf2-ros = ">=0.36.19,<0.37"
ros-jazzy-tf2-ros-py = ">=0.36.19,<0.37"
ros-jazzy-grid-map-msgs = ">=2.2.2,<3"
ros-jazzy-visualization-msgs = ">=5.3.6,<6"
ros-jazzy-sensor-msgs-py = ">=5.3.6,<6"
ros-jazzy-rviz2 = ">=14.1.19,<15"
ros-jazzy-grid-map-rviz-plugin = ">=2.2.2,<3"
onnxruntime-cpp = ">=1.26.0,<2"
numba = ">=0.65.1,<0.66"
ros-jazzy-joy = ">=3.3.0,<4"
ros-jazzy-teleop-twist-joy = ">=2.6.5,<3"
ros-jazzy-laser-geometry = ">=2.7.2,<3"
ros-jazzy-image-geometry = ">=4.1.0,<5"
ros-jazzy-teleop-twist-keyboard = ">=2.4.1,<3"
pcl = ">=1.15.1,<2"
sysroot_linux-aarch64 = ">=2.17,<3"
ros-jazzy-pcl-conversions = ">=2.6.2,<3"
ros-jazzy-rosbag2 = ">=0.26.9,<0.27"
textual = ">=8.2.7,<9"

[feature.test.pypi-dependencies]
artefacts-toolkit = ">=1.0.0, <2"

[feature.test.dependencies]
pytest = ">=9.0.3,<10"
pyyaml = ">=6.0.3,<7"
plotly = ">=6.8.0,<7"

[feature.test.activation]
scripts = ["scripts/tests_activation.sh"]

[feature.artefacts.pypi-dependencies]
artefacts-cli = "*"

[feature.artefacts.dependencies]
python = ">=3.14.5,<3.15"


[environments]
sim = ["sim", "rerun"]
sim-gpu = ["sim", "sim-cuda", "rerun"]
sim-test = ["sim", "test", "rerun"]
nav = ["nav", "rerun"]
nav-test = ["nav", "test", "rerun"]
artefacts = ["artefacts"]
